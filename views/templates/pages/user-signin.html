{{ define "title" }} Fazer login {{ end }} {{ define "main" }}
<form class="user-form" action="/user/signin" method="post">
  <h1>Entrar no sistema</h1>
  <label for="email">Email</label>
  <input type="text" name="email" id="email" />
  {{with .FieldErrors}}
  <ul class="errors">
    {{range .}}
    <li>{{ . }}</li>
    {{end}}
  </ul>
  {{end}} {{csrfField}}
  <label for="password">Senha</label>
  <input type="password" name="password" id="password" />
  <input type="checkbox" /><span>Mostrar senha</span>
  <button class="success" type="submit">Entrar</button>
  <p>
    Ainda não tem cadastrado? <a href="/user/signup">Faça o seu cadastro</a>
  </p>
</form>
{{end}} {{define "script"}}
<script>
  $(":checkbox").click(function () {
    if ($(this).is(":checked")) {
      $("#password").attr("type", "text");
    } else {
      $("#password").attr("type", "password");
    }
  });
</script>
{{end}}
