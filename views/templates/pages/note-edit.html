{{ define "title" }} Alterar Anotação {{ end }} {{ define "main" }}
<h1>Atualizar anotação</h1>

<form action="/note/save" method="post">
  <input type="hidden" name="id" value="{{.ID}}" />
  <label for="title">Título</label>
  <input id="title" type="text" name="title" value="{{.Title}}" />

  <label for="content">Conteúdo</label>
  <textarea name="content" id="content" rows="20" cols="10">
      {{- .Content -}}
  </textarea>

  <label for="color">Cor do Cartão</label>
  <input id="color" type="hidden" name="color" value="{{.Color}}" />
  <div class="color-picker">
    {{$color := .Color }} {{ range .Colors }}
    <div
      data-color="{{.}}"
      class="color {{.}} {{if eq . $color}}active{{end}} "
    ></div>
    {{end}}
  </div>

  <button class="success" type="submit">Salvar</button>
  <button class="neutral" type="button">Cancelar</button>
</form>

{{ end }} {{define "script"}}
<script>
  $(".color").click(function () {
    $(".color").removeClass("active");
    $(this).addClass("active");
    $("#color").val($(this).data("color"));
    // alert("Clicou na cor: " + $(this).data("color"));
  });
  $("button.neutral").click(function () {
    window.location.href = "/";
  });
</script>
{{end}}
