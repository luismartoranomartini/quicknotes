{{ define "base" }}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ template "title" . }} - Quicknotes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <header>
      <div class="wrapper">
        <h1><a href="/">Quicknotes</a></h1>
      </div>
      <nav>
        <div class="wrapper">
          <a href="/">Home</a>
          <a href="/note/new">Adicionar Anotação</a>
        </div>
      </nav>
    </header>
    <main><div class="wrapper">{{ template "main" . }}</div></main>
    <footer>
      <script src="/static/js/jquery.min.js"></script>
      <script src="/static/js/index.js"></script>
      {{ block "script" .}} {{end}}
      <div class="wrapper">&copy;2026 by <a href="/">Luís Martini</a>.</div>
    </footer>
  </body>
</html>

{{ end }}
