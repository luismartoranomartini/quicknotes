services:
  db:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=secret 
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
  adminer:
    image: adminer 
    ports:
      - "8080:8080"
  mailhog: 
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  pgdata:
